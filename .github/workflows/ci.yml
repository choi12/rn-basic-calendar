# Runs the same checks a contributor runs locally: typecheck, lint, tests, and the library build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Peer ranges resolve cleanly, so no .npmrc flags are needed here or locally
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # Same build prepublishOnly runs, so a broken lib/ fails here instead of at publish time
      - run: npm run build
